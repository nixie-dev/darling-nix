name: "Build and upload Darling"

on:
  push:
    paths:
      - flake.nix
      - flake.lock
      - 'packages/**'

jobs:
  build:
    name: Build Darling
    runs-on: ubuntu-latest
    environment: Cachix
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Nix
        uses: cachix/install-nix-action@v20
      - name: Set up Cachix access
        uses: cachix/cachix-action@v12
        with:
          name: nix-wrap
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pushFilter: "(-source|-man)$"
      - name: Build Darling output
        run: |
          nix build .#darling
          cachix push nix-wrap $(nix eval --raw .#darling)
          cachix pin nix-wrap darling $(nix eval --raw .#darling) --keep-forever
